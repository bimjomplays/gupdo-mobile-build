# XcodeGen spec for the GupDo iPhone app. The .xcodeproj, Sources/Info.plist and GupDo.entitlements are generated
# (`xcodegen generate`, on the macOS runner and by bin/check on Linux) and never committed. This folder also goes to
# the public build copy (bin/publish): nothing personal or secret here beyond the bundle id, which the signer needs;
# the team, keys and certificates come from the runner's secrets.
name: GupDo
options:
  bundleIdPrefix: com.dltnp
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 5 language mode, the same as GupDoKit's Package.swift (the app compiles its files)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # CI passes the run number as the build number (TestFlight wants it to grow)
    CURRENT_PROJECT_VERSION: "1"
targets:
  GupDo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # the plain logic (models, rules, scheduling): a Swift package that also builds and tests on Linux
      # (swift test --package-path GupDoKit); the app compiles its files directly, so nothing in it needs `public`.
      # optional: the folder may not exist yet while the package is being written
      - path: ../GupDoKit/Sources/GupDoKit
        optional: true
    # generated by XcodeGen from these properties (a hand-written file at this path would be overwritten)
    entitlements:
      path: GupDo.entitlements
      properties:
        # reminders, habits and event alerts break through Focus (not silent mode: AlarmKit alarms do that, and
        # AlarmKit itself needs no entitlement, only NSAlarmKitUsageDescription)
        com.apple.developer.usernotifications.time-sensitive: true
        # habit proof by NFC tag: reads a tag's id (Core NFC tag reader session); the App ID needs NFC Tag Reading
        com.apple.developer.nfc.readersession.formats: [TAG]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GupDo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBG
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        # a background refresh replans now and then (habits are planned a day ahead), see AppDelegate; location: while a
        # habit waits for driving to stop, location updates keep running in the background to see when it does
        UIBackgroundModes: [fetch, location]
        BGTaskSchedulerPermittedIdentifiers: [com.dltnp.gupdo.replan]
        ITSAppUsesNonExemptEncryption: false
        # AlarmKit (iOS 26): reminders, habits and events that were ignored ring as real alarms, even on silent
        NSAlarmKitUsageDescription: >-
          GupDo rings a full-screen alarm when a reminder, habit or event you set is still waiting for an answer, so it
          gets through even on silent.
        # habit proof: a live photo of the habit's spot, compared with the reference photo taken at setup
        NSCameraUsageDescription: >-
          GupDo uses the camera to take a photo of a habit's spot, when you set the habit up and when you prove you did
          it. Photos stay on this iPhone.
        # "when I arrive" reminders, place habits, location proof and time to leave for events
        NSLocationWhenInUseUsageDescription: >-
          GupDo uses your location to prove a habit at its place and to work out when to leave for an event.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          GupDo uses your location in the background to remind you when you arrive somewhere and to start a place
          habit when you get there. Your location stays on this iPhone.
        # habit proof by NFC tag (entitlement above). Polling ISO 14443 needs at least one ISO 7816 application id
        # listed; this is the standard NDEF application, so tags that present as ISO 7816 can be read too
        NFCReaderUsageDescription: GupDo reads the NFC tag you placed at a habit's spot to prove you did it.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers: [D2760000850101]
        # "Can't right now" is only offered while driving (Core Motion's automotive activity)
        NSMotionUsageDescription: >-
          GupDo checks whether you are driving, so a habit can wait until you get there instead of ringing on the
          road.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dltnp.gupdo
        PRODUCT_NAME: GupDo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        # unsigned by default (simulator builds and tests); the release job archives ad-hoc signed and the
        # TestFlight export signs with Apple's cloud-managed distribution certificate
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
  GupDoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      # GupDoKit's tests run here too, against the app's copy of the same files
      - path: ../GupDoKit/Tests/GupDoKitTests
        optional: true
    dependencies:
      - target: GupDo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.dltnp.gupdo.tests
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  GupDo:
    build:
      targets:
        GupDo: all
        GupDoTests: [test]
    test:
      config: Debug
      targets:
        - GupDoTests
    archive:
      config: Release
